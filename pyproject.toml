[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc-multilingual-judge-calibration"
version = "0.1.0"
description = "Reproduction package for label-free multilingual LLM-judge calibration with Consensus-Based Calibration (CBC)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Authors"}
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "matplotlib==3.9.2",
  "huggingface_hub==0.25.1",
  "litellm==1.50.0",
  "python-dotenv==1.0.1",
  "tenacity==9.0.0",
]

[tool.setuptools]
py-modules = ["languages", "requirement_taxonomy"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
