[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc-multilingual-judge-calibration"
version = "0.2.0"
description = "Reproducibility code and saved evidence for language-conditioned rank reversal and label-free calibration in agentic LLM judges."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Authors"}
]
dependencies = [
  "numpy==2.4.2",
  "pandas==3.0.1",
  "scipy==1.17.1",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
collection = [
  "huggingface_hub==0.25.1",
  "litellm==1.50.0",
  "python-dotenv==1.0.1",
  "tenacity==9.0.0",
]
embeddings = ["sentence-transformers"]

[tool.setuptools]
py-modules = ["languages", "requirement_taxonomy"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
